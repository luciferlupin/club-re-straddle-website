<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE79A" />
      <stop offset="30%" stop-color="#FFBB35" />
      <stop offset="70%" stop-color="#D49013" />
      <stop offset="100%" stop-color="#FFD466" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D1" />
      <stop offset="50%" stop-color="#FFBB35" />
      <stop offset="100%" stop-color="#AA7107" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Crown on Top -->
  <g transform="translate(160, 24)" filter="url(#goldGlow)">
    <!-- Crown Base & Points -->
    <path d="M -32,24 L -38,2 L -18,12 L 0,-6 L 18,12 L 38,2 L 32,24 Z" fill="url(#goldGrad)" />
    <!-- Jewels on Crown tips -->
    <circle cx="-38" cy="1" r="3" fill="#FFF8DE" />
    <circle cx="-18" cy="11" r="2.5" fill="#FFF8DE" />
    <circle cx="0" cy="-7" r="3.5" fill="#FFF8DE" />
    <circle cx="18" cy="11" r="2.5" fill="#FFF8DE" />
    <circle cx="38" cy="1" r="3" fill="#FFF8DE" />
    <!-- Crown Filigree details -->
    <path d="M -26,24 Q 0,18 26,24" stroke="#7A4E02" stroke-width="1.5" fill="none" />
    <circle cx="-16" cy="19" r="1.5" fill="#FFF8DE" />
    <circle cx="0" cy="17" r="2" fill="#FFF8DE" />
    <circle cx="16" cy="19" r="1.5" fill="#FFF8DE" />
  </g>

  <!-- Ornate Wings / Flourishes Left & Right -->
  <g transform="translate(160, 75)" filter="url(#goldGlow)">
    <!-- Left Flourish -->
    <path d="M -60,-22 C -95,-35 -125,-15 -135,10 C -120,-2 -90,-8 -65,0 C -85,12 -110,25 -118,42 C -105,30 -75,20 -55,16" 
          fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M -75,-10 C -100,-15 -115,0 -118,15 C -105,8 -88,6 -70,8" 
          fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" />
          
    <!-- Right Flourish -->
    <path d="M 60,-22 C 95,-35 125,-15 135,10 C 120,-2 90,-8 65,0 C 85,12 110,25 118,42 C 105,30 75,20 55,16" 
          fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 75,-10 C 100,-15 115,0 118,15 C 105,8 88,6 70,8" 
          fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Laurel / Ribbon Frame -->
  <g transform="translate(160, 68)">
    <!-- Top Arc CLUB -->
    <text x="0" y="8" font-family="'Fjalla One', 'Montserrat', Arial-BoldMT, sans-serif" font-size="16" font-weight="700" letter-spacing="7" fill="url(#goldLight)" text-anchor="middle">CLUB</text>
    
    <!-- Main Text: RE STRADDLE -->
    <text x="0" y="38" font-family="'Fjalla One', 'Montserrat', Impact, sans-serif" font-size="28" font-weight="900" letter-spacing="3" fill="url(#goldGrad)" text-anchor="middle" filter="url(#goldGlow)">RE STRADDLE</text>
    
    <!-- Underline divider bar with diamond -->
    <line x1="-80" y1="48" x2="80" y2="48" stroke="url(#goldGrad)" stroke-width="1.5" />
    <polygon points="0,45 4,48 0,51 -4,48" fill="#FFF8DE" />
    <circle cx="-80" cy="48" r="2" fill="url(#goldGrad)" />
    <circle cx="80" cy="48" r="2" fill="url(#goldGrad)" />
  </g>

  <!-- Poker Card Suits Bottom: ♠ ♥ ♦ ♣ -->
  <g transform="translate(160, 136)" fill="url(#goldGrad)">
    <!-- Spade ♠ -->
    <path d="M -36,8 C -36,8 -44,3 -44,-3 C -44,-7 -41,-10 -36,-10 C -31,-10 -28,-7 -28,-3 C -28,3 -36,8 -36,8 Z M -37,7 L -39,12 L -33,12 L -35,7 Z" transform="translate(0, 0)" />
    <!-- Heart ♥ -->
    <path d="M -12,-8 C -16,-8 -18,-5 -18,-2 C -18,4 -12,9 -12,9 C -12,9 -6,4 -6,-2 C -6,-5 -8,-8 -12,-8 Z" transform="translate(0, 0)" />
    <!-- Diamond ♦ -->
    <polygon points="12,-8 18,1 12,10 6,1" />
    <!-- Club ♣ -->
    <path d="M 36,-1 C 38,-1 40,-3 40,-5 C 40,-7 38,-9 36,-9 C 34,-9 32,-7 32,-5 C 32,-3 34,-1 36,-1 Z M 32,2 C 30,2 28,0 28,-2 C 28,-4 30,-6 32,-6 C 34,-6 36,-4 36,-2 C 36,0 34,2 32,2 Z M 40,2 C 42,2 44,0 44,-2 C 44,-4 42,-6 40,-6 C 38,-6 36,-4 36,-2 C 36,0 38,2 40,2 Z M 35,0 L 33,8 L 39,8 L 37,0 Z" />
  </g>
</svg>
